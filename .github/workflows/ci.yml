name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate skill package
        run: python scripts/validate_skill.py .

      - name: Lint example design
        run: python scripts/lint_design_doc.py examples/sample-detailed-design.md --strict

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build release package
        run: python scripts/package_skill.py --output-dir dist
